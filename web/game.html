<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Tents and Trees</title>
    <link rel="stylesheet" href="game.css">
</head>

<body>

    <!-- ********************* html ********************* -->

    <div class="main-container">
        <header>
            <h1>Tents & Trees</h1>
        </header>

        <div class="game-layout">
            <div class="canvas-container">
                <canvas id="mycanvas" width="900px" height="900px"></canvas>
            </div>

            <div class="controls-container">
                <div class="control-group">
                    <h3>Settings</h3>

                    <div class="input-row">
                        <label for="input_nb_cols">Columns :</label>
                        <input type="number" id="input_nb_cols" value="8" min="2" max="25">
                    </div>
                    <div class="input-row">
                        <label for="input_nb_rows">Rows :</label>
                        <input type="number" id="input_nb_rows" value="8" min="2" max="25">
                    </div>
                    <div class="input-row">
                        <label for="input_nb_tree">Trees :</label>
                        <input type="number" id="input_nb_tree" value="4" min="0" max="25">
                    </div>
                    <div class="input-row">
                        <label for="input_nb_bigtree">BigTrees :</label>
                        <input type="number" id="input_nb_bigtree" value="1" min="0" max="25">
                    </div>

                    <div class="checkbox-row">
                        <input type="checkbox" id="btn_wrapping">
                        <label for="btn_wrapping">Wrapping ON/OFF</label>
                    </div>

                    <button id="btn_play"> Play </button>

                </div>

                <div class="control-group">
                    <h3>Game Options</h3>

                    <div class="button-grid">
                        <button id="btn_fill_grass"> Fill Grass </button>
                        <button id="btn_restart"> Restart </button>
                        <button id="btn_undo"> Undo </button>
                        <button id="btn_redo"> Redo </button>
                        <button id="btn_solve"> Solve </button>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p><em>aurelien.esnard@u-bordeaux.fr, 2026.</em></p>
        </footer>

    </div>

    <!-- ********************* script ********************* -->

    <script src="game.js"></script>
    <script src="interface.js"> </script>

</body>

</html>
